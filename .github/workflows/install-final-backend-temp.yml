name: Install final V116 backend source
on:
  push:
    branches: [audit/v116-final-contract]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore canonical Apps Script source
        run: |
          cat > /tmp/code.gz.b64 <<'B64'
[... ELLIPSIZATION ...]
B64
          base64 -d /tmp/code.gz.b64 > /tmp/code.gz
          gunzip -c /tmp/code.gz > apps-script/code.js
          node --check apps-script/code.js
          node tools/verify-contract.js
          grep -q "BUILD: 'V116-FINAL-20260826'" apps-script/code.js
      - name: Commit canonical backend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/code.js
          git commit -m "chore: lock canonical V1.1.6 Apps Script backend"
          git push
