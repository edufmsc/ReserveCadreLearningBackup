name: V1.0 Fast Write Read

on:
  push:
    branches:
      - perf/v1-fast-write-read

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/v1-fast-write-read
      - name: Apply Fast Write patch
        run: python tools/patch-v1-fast-write-read.py
      - name: Verify frontend
        run: |
          node --check app.js
          node tools/verify-contract.js
          grep -F 'function applyAdminFastWrite' app.js
          grep -F 'app.js?v=1.0-fast-write-20260922' index.html
      - name: Commit verified patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js index.html
          git commit -m 'perf: apply admin delta writes without full catalog rebuild'
          git push origin HEAD:perf/v1-fast-write-read
