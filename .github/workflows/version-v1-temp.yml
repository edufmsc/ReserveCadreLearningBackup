name: Temporary V1.0 version-only verifier
on:
  push:
    branches: [chore/version-v1-0]
permissions:
  contents: write
jobs:
  version_only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change app version label only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          old="const VERSION = 'V1.1.6';"
          new="const VERSION = 'V1.0';"
          assert s.count(old)==1, f'expected exactly one old VERSION, got {s.count(old)}'
          p.write_text(s.replace(old,new,1), encoding='utf-8')
          PY
          node --check app.js
          grep -q "const VERSION = 'V1.0'" app.js
          ! grep -q "const VERSION = 'V1.1.6'" app.js
      - name: Commit app version label
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js
          git diff --cached --exit-code && exit 0
          git commit -m "chore: rename frontend version to V1.0"
          git push origin HEAD:chore/version-v1-0
