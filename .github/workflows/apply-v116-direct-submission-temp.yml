name: Apply V116 direct submission temp
on:
  push:
    branches: [feat/v116-direct-submission-final]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'ci: trigger direct submission patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v116-direct-submission-final
      - name: Apply patch
        run: |
          node tools/patch-v116-direct-submission-final.js
          node --check app.js
          grep -q "packageDirectSubmissionV116" app.js
          grep -q "loadXlsx" app.js
          grep -q "課程回傳設定" app.js
      - name: Cleanup patcher and commit
        run: |
          rm tools/patch-v116-direct-submission-final.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js tools/patch-v116-direct-submission-final.js
          git commit -m "feat: add direct course submissions and xlsx export"
          git push origin HEAD:feat/v116-direct-submission-final
