<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8f3b12">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>教育中心備援學習平台｜V1.0</title>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://www.youtube.com" crossorigin>
  <link rel="dns-prefetch" href="//script.google.com">
  <link rel="stylesheet" href="styles.css?v=1.0">
  <style>
    #studentReportPanel{display:none}
    #studentDashboard:has([data-student-tab="report"].is-active) #studentReportPanel{display:block}
    .report-panel-card{border:1px solid var(--line);border-radius:17px;background:#fff;box-shadow:0 6px 18px rgba(72,42,26,.06);overflow:hidden}
    .report-panel-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;padding:16px;border-bottom:1px solid var(--line)}
    .report-panel-head h2{margin-bottom:5px}.report-panel-head p{margin:0;font-size:.82rem}
    .report-panel-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .report-panel-actions a{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
    .report-frame-wrap{background:var(--soft)}
    .report-frame{display:block;width:100%;height:min(78vh,980px);min-height:680px;border:0;background:#fff}
    .report-panel-note{margin:0;padding:11px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:.78rem;background:#fffdfa}
    @media (max-width:700px){.report-panel-head{display:grid}.report-panel-actions{justify-content:stretch}.report-panel-actions>*{flex:1}.report-frame{height:72vh;min-height:620px}}
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div><p class="eyebrow">鬍鬚張｜教育中心</p><h1>教育中心備援學習平台</h1></div>
      <span id="modeBadge" class="status-badge status-badge--checking">檢查連線</span>
    </header>

    <main class="app-main">
      <section id="bootView" class="card boot-card"><div class="boot-spinner" aria-hidden="true"></div><strong>正在載入最新資料…</strong></section>
      <section id="loginView" class="card login-card" aria-labelledby="loginTitle" hidden>
        <div class="card-heading"><p class="step-label">登入</p><h2 id="loginTitle">帳號＋密碼登入</h2></div>
        <form id="loginForm" novalidate>
          <label class="field-group"><span>帳號</span><input id="employeeId" name="employeeId" type="text" autocomplete="username" placeholder="請輸入帳號" required></label>
          <label class="field-group"><span>密碼</span><div class="password-wrap"><input id="password" name="password" type="password" inputmode="numeric" autocomplete="current-password" maxlength="4" placeholder="4 碼數字" required><button id="togglePassword" class="icon-button" type="button" aria-label="顯示密碼">顯示</button></div></label>
          <div id="loginMessage" class="form-message form-message--error" role="alert" hidden></div>
          <button id="loginButton" class="primary-button" type="submit">登入</button>
        </form>
      </section>

      <section id="dashboardView" class="dashboard" hidden>
        <article class="card profile-card profile-card--compact"><div class="profile-topline"><div><p class="step-label">登入中</p><h2><span id="userName">—</span>，您好</h2><p class="profile-subline"><span id="userMeta">—</span></p></div><div class="profile-actions"><span id="userRole" class="role-badge">—</span><button id="logoutButton" class="text-button text-button--danger" type="button">登出</button></div></div></article>

        <section id="lessonPage" class="lesson-page" hidden>
          <div class="lesson-page__top"><button id="backLessonButton" class="secondary-button lesson-back-button" type="button">← 返回課程</button><div class="lesson-page__heading"><p id="lessonPackageName" class="step-label">—</p><h2 id="lessonTitle">—</h2></div></div>
          <div id="lessonMeta" class="lesson-meta"></div><div id="lessonContent" class="lesson-content"></div><div class="lesson-page__footer"><div id="lessonFooterActions" class="lesson-footer-actions"><button id="lessonBackBottomButton" class="secondary-button" type="button">← 返回課程</button><button id="completeLessonButton" class="primary-button" type="button">完成此子課程</button><button id="nextLessonButton" class="primary-button" type="button" hidden>繼續下一個子課程 →</button></div></div>
        </section>

        <section id="studentDashboard" hidden>
          <nav class="tab-bar" aria-label="學員功能"><button class="tab-button is-active" data-student-tab="courses" type="button">我的課程</button><button class="tab-button" data-student-tab="records" type="button">學習紀錄</button><button class="tab-button" data-student-tab="report" type="button">紀錄回報</button></nav>
          <section id="studentCoursesPanel" class="tab-panel"><div id="studentSummary" class="summary-grid"></div><div class="panel-heading"><div><h2>我的課程</h2></div></div><div id="packageList" class="package-list"></div></section>
          <section id="studentRecordsPanel" class="tab-panel" hidden><div class="panel-heading"><div><h2>學習紀錄</h2></div></div><div id="studentRecordsList" class="record-list"></div></section>
          <section id="studentReportPanel" class="tab-panel" aria-label="紀錄回報">
            <article class="report-panel-card">
              <div class="report-panel-head"><div><p class="step-label">紀錄回報</p><h2>實際錄用紀錄回報</h2><p>每完成一位實際錄用請填寫一筆；送出後可立即繼續回報下一筆。</p></div><div class="report-panel-actions"><button id="resetRecordReportButton" class="secondary-button primary-button--fit" type="button">填寫下一筆</button><a class="secondary-button primary-button--fit" href="https://forms.gle/rSCuspJrPx5YmKAp7" target="_blank" rel="noopener">另開問卷</a></div></div>
              <div class="report-frame-wrap"><iframe id="recordReportFrame" class="report-frame" title="實際錄用紀錄回報問卷" src="https://forms.gle/rSCuspJrPx5YmKAp7" loading="lazy" referrerpolicy="strict-origin-when-cross-origin">正在載入問卷…</iframe></div>
              <p class="report-panel-note">若剛送出一筆要繼續填寫，請按「填寫下一筆」重新載入空白問卷；若裝置無法顯示內嵌問卷，可使用「另開問卷」。</p>
            </article>
          </section>
        </section>

        <section id="adminDashboard" hidden>
          <nav class="tab-bar tab-bar--admin" aria-label="教育中心功能"><button class="tab-button is-active" data-admin-tab="people" type="button">依人員查看</button><button class="tab-button" data-admin-tab="courses" type="button">依課程查看</button><button class="tab-button" data-admin-tab="manage" type="button">課程管理</button></nav>
          <section id="adminTrackingPanel" class="tab-panel"><div id="adminSummary" class="summary-grid"></div><form id="adminSearchForm" class="search-bar" onsubmit="return false;"><input id="adminSearch" type="search" placeholder="搜尋帳號、姓名、店別或課程"></form><div id="adminPeoplePanel" class="accordion-list"></div><div id="adminCoursesPanel" class="accordion-list" hidden></div></section>
          <section id="adminManagePanel" class="tab-panel" hidden><div class="panel-heading manage-heading"><div><h2>課程管理</h2><p class="package-meta">課程可直接放教材，也可建立多個子課程</p></div><div class="manage-heading__actions"><button id="exportProgressButton" class="secondary-button primary-button--fit" type="button">匯出訓練紀錄</button><button id="newPackageButton" class="primary-button primary-button--fit" type="button">＋ 新增課程</button></div></div><div id="adminCatalogSummary" class="summary-grid"></div><div id="adminCatalogList" class="manage-list"></div></section>
        </section>
      </section>
    </main>

    <footer class="app-footer"><span>教育中心備援學習平台</span><span>系統版本 V1.0｜Clean Fast 正式版</span></footer>
  </div>

  <div id="adminEditorOverlay" class="overlay" hidden><section class="sheet-dialog admin-editor-dialog" role="dialog" aria-modal="true" aria-labelledby="adminEditorTitle"><header class="sheet-header"><div><p class="step-label">教育中心</p><h2 id="adminEditorTitle">課程管理</h2></div><button id="closeAdminEditorButton" class="close-button" type="button" aria-label="關閉">×</button></header><div id="adminEditorBody" class="sheet-content"></div></section></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="api_config.js?v=1.0"></script>
  <script src="app.js?v=1.0"></script>
  <script>
    (() => {
      const FORM_URL = 'https://forms.gle/rSCuspJrPx5YmKAp7';
      const button = document.getElementById('resetRecordReportButton');
      const frame = document.getElementById('recordReportFrame');
      if (!button || !frame) return;
      button.addEventListener('click', () => {
        button.disabled = true;
        button.textContent = '重新載入中…';
        frame.src = 'about:blank';
        window.setTimeout(() => {
          frame.src = FORM_URL;
          button.disabled = false;
          button.textContent = '填寫下一筆';
          frame.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 120);
      });
    })();
  </script>
</body>
</html>
