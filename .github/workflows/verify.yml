name: Verify learning platform

on:
  push:
    branches: [main, feat/v116-direct-submission-final]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply direct submission patch on feature branch
        if: github.ref_name == 'feat/v116-direct-submission-final'
        run: |
          node tools/patch-v116-direct-submission-final.js
          node --check app.js
          grep -q "packageDirectSubmissionV116" app.js
          grep -q "loadXlsx" app.js
          grep -q "課程回傳設定" app.js
      - name: Syntax check
        run: |
          node --check app.js
          node --check tools/verify-contract.js
      - name: Structural checks
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f api_config.js
          test -f apps-script/contract.json
          test -f tools/verify-contract.js
          grep -q "const VERSION = 'V1.1.6'" app.js
          grep -q "NON_JSON_RESPONSE" app.js
          grep -q "submissionDeleteChains" app.js
          grep -q "pdfPageObservers" app.js
          grep -q "contentFileUploadV116" app.js
          grep -q "V1.1.6" index.html
          test ! -e app.v112.loader.js
          test ! -e app.bundle.001
      - name: Frontend backend contract
        run: node tools/verify-contract.js
      - name: Commit verified feature patch
        if: github.ref_name == 'feat/v116-direct-submission-final'
        run: |
          rm -f tools/patch-v116-direct-submission-final.js .trigger-direct-submission .trigger-direct-submission-2 .github/workflows/apply-v116-direct-submission-temp.yml
          git checkout origin/main -- .github/workflows/verify.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add direct course submissions and xlsx export"
          git push origin HEAD:feat/v116-direct-submission-final
