name: V114 UX patch

on:
  push:
    branches: [perf/v114-upload-pdf-logout]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: node tools/patch-v114-ux.js
      - name: Verify
        run: |
          node --check app.js
          grep -q "const VERSION = 'V1.1.4'" app.js
          grep -q "所有 PDF 都走自有 PDF.js" app.js
          grep -q "伺服器 session 清除改為背景執行" app.js
          grep -q "V1.1.4" index.html
          ! grep -q "pdf-drive-frame.*src" app.js
      - name: Commit result
        run: |
          rm tools/patch-v114-ux.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html tools/patch-v114-ux.js
          git commit -m "fix: speed logout and use clean PDF reader"
          git push
