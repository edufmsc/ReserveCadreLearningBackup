name: V1.0 applicability repair

on:
  push:
    branches:
      - fix/v1-applicability-ids

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1-applicability-ids
      - name: Apply applicability patch
        run: python tools/patch-v1-applicability.py
      - name: Verify frontend
        run: |
          node --check app.js
          node tools/verify-contract.js
          grep -F 'applicabilityInfo(lesson)' app.js
          grep -F 'applicabilitySelectionSummary' app.js
          grep -F 'app.js?v=1.0-applicability-20260906' index.html
      - name: Commit verified patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js index.html
          git commit -m 'fix: validate and display applicable learner ids'
          git push origin HEAD:fix/v1-applicability-ids
