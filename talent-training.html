<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8f3b12">
  <title>人才培訓進度｜教育中心</title>
  <link rel="stylesheet" href="talent-training.css">
</head>
<body>
  <main class="page-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">鬍鬚張｜教育中心</p>
        <h1>人才培訓進度</h1>
        <p class="hero-copy">集中查看職能積分、考核結果、教育中心安排項目與既有培訓履歷。</p>
      </div>
      <div class="hero-actions">
        <label class="search-box">
          <span>搜尋學員</span>
          <input id="searchInput" type="search" placeholder="姓名／店別／職務">
        </label>
      </div>
    </header>

    <section class="summary-grid" id="summaryGrid"></section>

    <section class="toolbar-card">
      <div>
        <strong>培訓名單</strong>
        <span>點選人員即可查看完整進度</span>
      </div>
      <div class="filters">
        <button class="filter-btn is-active" data-filter="all" type="button">全部</button>
        <button class="filter-btn" data-filter="ready" type="button">可安排</button>
        <button class="filter-btn" data-filter="pending" type="button">培訓中</button>
        <button class="filter-btn" data-filter="complete" type="button">已完成</button>
      </div>
    </section>

    <section class="people-grid" id="peopleGrid"></section>
  </main>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="drawer" id="detailDrawer" aria-hidden="true">
    <div class="drawer-header">
      <div>
        <p class="eyebrow">人才培訓明細</p>
        <h2 id="drawerName">—</h2>
        <p id="drawerMeta">—</p>
      </div>
      <button class="close-btn" id="closeDrawer" type="button" aria-label="關閉">×</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <script src="talent-training.js"></script>
</body>
</html>
