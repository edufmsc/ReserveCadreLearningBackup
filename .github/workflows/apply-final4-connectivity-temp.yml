name: Temporary FINAL4 verifier
on:
  push:
    branches: [fix/v116-connectivity-final4]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify
        run: |
          python3 tools/patch-connectivity-final4.py
          node --check app.js
          node --check tools/verify-contract.js
          grep -q "SAFE_RETRY_ACTIONS" app.js
          grep -q "startConnectionMonitor" app.js
          grep -q "連線較慢｜自動重試" app.js
          grep -q "2500" app.js
          node tools/verify-contract.js
      - name: Commit verified app
        run: |
          rm tools/patch-connectivity-final4.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js tools/patch-connectivity-final4.py
          git commit -m "fix: harden connectivity and cold start recovery"
          git push origin HEAD:fix/v116-connectivity-final4
