name: Consolidate frontend

on:
  push:
    branches: [chore/consolidate-v113-frontend]

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidate runtime
        run: node tools/consolidate-frontend.js
      - name: Verify runtime
        run: |
          node --check app.js
          grep -q "const VERSION = 'V1.1.3';" app.js
          grep -q "drivePreviewUrl" app.js
          grep -q "applicabilityMode" app.js
          test ! -e app.v112.loader.js
          test ! -e app.bundle.001
          test ! -e app.bundle.002
          test ! -e app.bundle.003
          test ! -e app.bundle.004
      - name: Commit result
        run: |
          rm -f tools/consolidate-frontend.js
          rmdir tools 2>/dev/null || true
          rm -f .github/workflows/consolidate-frontend.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: consolidate V1.1.3 frontend source"
          git push origin HEAD:chore/consolidate-v113-frontend
