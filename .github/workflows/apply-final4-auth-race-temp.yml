name: Temporary FINAL4 auth verifier
on:
  push:
    branches: [fix/v116-final4-auth-race]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply auth race patch
        run: |
          python3 tools/patch-final4-auth-race.py
          node --check app.js
          node tools/verify-contract.js
          grep -q "authGeneration" app.js
      - name: Commit verified app
        run: |
          rm tools/patch-final4-auth-race.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js tools/patch-final4-auth-race.py
          git commit -m "fix: prevent stale session restore from overriding login"
          git push origin HEAD:fix/v116-final4-auth-race
