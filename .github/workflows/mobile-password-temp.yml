name: Mobile password input patch

on:
  push:
    branches:
      - feat/v1-mobile-password-input

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v1-mobile-password-input
      - name: Patch mobile password input
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<input id="password" name="password" type="password" inputmode="numeric" autocomplete="current-password" maxlength="4" placeholder="4 碼數字" required>'
          new = '<input id="password" name="password" type="password" inputmode="text" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="4" placeholder="4 碼英數" required>'
          if old not in text:
              raise SystemExit('password input target not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify password field
        run: |
          grep -F 'id="password"' index.html | grep -F 'inputmode="text"' | grep -F 'placeholder="4 碼英數"'
          ! grep -F 'id="password"' index.html | grep -F 'inputmode="numeric"'
          node --check app.js
          node tools/verify-contract.js
      - name: Commit verified patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'fix: allow alphanumeric password input on mobile'
          git push origin HEAD:feat/v1-mobile-password-input
