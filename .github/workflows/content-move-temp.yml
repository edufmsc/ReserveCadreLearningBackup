name: Temporary content move verifier
on:
  push:
    branches: [feat/v1-content-move-batch]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply content move UI patch
        run: |
          python3 tools/patch-content-move.py
          node --check app.js
          node tools/verify-contract.js
          grep -q "contentMoveV1" app.js
          grep -q "moveContentsToLesson" app.js
          grep -q "data-content-move-check" app.js
          grep -q "批次移至子課程" app.js
          grep -q "const VERSION = 'V1.0'" app.js
      - name: Commit verified frontend
        run: |
          rm tools/patch-content-move.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js apps-script/contract.json tools/verify-contract.js tools/patch-content-move.py
          git commit -m "feat: move direct materials to child lessons in batch"
          git push origin HEAD:feat/v1-content-move-batch
