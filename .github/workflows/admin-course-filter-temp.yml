name: Admin course filter patch

on:
  push:
    branches:
      - feat/v1-admin-course-filter

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v1-admin-course-filter
      - name: Apply patch
        run: python tools/patch-admin-course-filter.py
      - name: Verify patch
        run: |
          node --check app.js
          node tools/verify-contract.js
          grep -F 'adminCourseSelect' app.js
          grep -F 'adminCourseStatus' app.js
          grep -F 'adminCourseStore' app.js
          grep -F 'adminCourseSearch' app.js
          grep -F 'adminCourseSort' app.js
          grep -F 'renderAdminCoursePersonDetails' app.js
          grep -F 'adminSearchForm' app.js
          grep -F 'styles.css?v=1.0-adminfilter-20260828' index.html
          grep -F 'app.js?v=1.0-adminfilter-20260828' index.html
      - name: Commit verified patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js styles.css index.html
          git commit -m 'feat: add focused admin course filters'
          git push origin HEAD:feat/v1-admin-course-filter
