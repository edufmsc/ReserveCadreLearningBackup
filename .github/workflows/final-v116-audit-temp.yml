name: Final V116 live audit
on:
  push:
    branches: [audit/v116-final-contract]
permissions:
  contents: read
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe deployed V1.1.6 API
        env:
          API_URL: https://script.google.com/macros/s/AKfycbwd17jSaxmpvmS6dn9wJemT_Yv7rRABA7Iwsu8VdWZVZvoAyZ7xaKFRg-Vp1LccpEUn0Q/exec
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, tempfile, time
          url=os.environ['API_URL']
          tests=[
            ('health', {'action':'health','payload':{},'sessionToken':''}),
            ('invalid_login_1', {'action':'login','payload':{'employeeId':'__FINAL_SMOKE_INVALID__','password':'0000'},'sessionToken':''}),
            ('invalid_login_2', {'action':'login','payload':{'employeeId':'__FINAL_SMOKE_INVALID__','password':'0000'},'sessionToken':''}),
          ]
          for name,payload in tests:
            path=tempfile.mktemp(); start=time.time()
            p=subprocess.run(['curl','-sS','-L','--max-time','25','-o',path,'-w','HTTP=%{http_code} TYPE=%{content_type} TOTAL=%{time_total}', '-H','Content-Type: text/plain;charset=UTF-8','--data-binary',json.dumps(payload),url],text=True,capture_output=True)
            body=open(path,'r',encoding='utf-8',errors='replace').read() if os.path.exists(path) else ''
            print(name, 'RC='+str(p.returncode), p.stdout, 'WALL=%.3f'%(time.time()-start), 'PREFIX='+repr(body[:260]))
            if p.returncode: raise SystemExit(name+' curl failed '+p.stderr)
            data=json.loads(body)
            if name=='health':
              assert data.get('success') is True and data.get('data',{}).get('ok') is True, data
              assert data.get('data',{}).get('version') == 'V1.1.6', data
              f=data.get('data',{}).get('features',{})
              for k in ['lazyDataV114','batchUploadV114','contentFileUploadV116','submissions','forceComplete']:
                assert f.get(k) is True, (k,f)
            else:
              assert data.get('success') is False and data.get('error',{}).get('code') == 'LOGIN_FAILED', data
          PY
