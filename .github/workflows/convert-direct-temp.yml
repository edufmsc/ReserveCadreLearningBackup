name: Temporary direct lesson conversion verifier
on:
  push:
    branches: [feat/v1-convert-direct]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify conversion UI
        run: |
          python3 tools/patch-convert-direct.py
          node --check app.js
          node tools/verify-contract.js
          grep -q "data-convert-direct" app.js
          grep -q "openConvertDirectLessonEditor" app.js
          grep -q "kind === 'convertDirect'" app.js
          grep -q "const VERSION = 'V1.0'" app.js
      - name: Commit verified app
        run: |
          rm tools/patch-convert-direct.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js tools/patch-convert-direct.py
          git commit -m "feat: convert direct course material into child lesson"
          git push origin HEAD:feat/v1-convert-direct
