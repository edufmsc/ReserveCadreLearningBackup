name: Temporary content move timeout verifier
on:
  push:
    branches: [fix/v1-content-move-timeout]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply timeout fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          old="const data = await api(action, payload, state.token, { timeout: action === 'saveContent' && payload?.fileBase64 ? 90000 : 15000 });"
          new="const timeout = action === 'saveContent' && payload?.fileBase64 ? 90000 : action === 'moveContentsToLesson' ? 90000 : 15000;\n    const data = await api(action, payload, state.token, { timeout });"
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check app.js
          node tools/verify-contract.js
          grep -q "action === 'moveContentsToLesson' ? 90000" app.js
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js
          git commit -m "fix: allow content migration to finish before timeout"
          git push origin HEAD:fix/v1-content-move-timeout
