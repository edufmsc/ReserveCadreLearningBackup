name: Live API now temp
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    if: github.event.head_commit.message == 'test: probe live API after V116 redeploy'
    runs-on: ubuntu-latest
    steps:
      - name: Probe current configured API
        run: |
          python3 - <<'PY'
          import json,subprocess,tempfile,time
          url='https://script.google.com/macros/s/AKfycbwd17jSaxmpvmS6dn9wJemT_Yv7rRABA7Iwsu8VdWZVZvoAyZ7xaKFRg-Vp1LccpEUn0Q/exec'
          for name,payload in [('health',{'action':'health','payload':{},'sessionToken':''}),('login',{'action':'login','payload':{'employeeId':'__INVALID_NOW__','password':'0000'},'sessionToken':''})]:
            pth=tempfile.mktemp(); st=time.time()
            p=subprocess.run(['curl','-sS','-L','--max-time','40','-o',pth,'-w','HTTP=%{http_code} TYPE=%{content_type} TOTAL=%{time_total}','-H','Content-Type: text/plain;charset=UTF-8','--data-binary',json.dumps(payload),url],capture_output=True,text=True)
            body=open(pth,encoding='utf-8',errors='replace').read() if __import__('os').path.exists(pth) else ''
            print(name,p.returncode,p.stdout,'WALL',round(time.time()-st,3),'BODY',repr(body[:600]))
            if p.returncode: raise SystemExit(p.stderr)
            json.loads(body)
          PY
