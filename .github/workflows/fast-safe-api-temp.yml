name: Temporary fast safe API patch
on:
  push:
    branches: [fix/v114-fast-safe-api]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/patch-fast-safe-api.js
      - run: |
          node --check app.js
          grep -q "NON_JSON_RESPONSE" app.js
          grep -q "submissionDeleteChains" app.js
          grep -q "timeout: 7000" app.js
      - run: |
          rm tools/patch-fast-safe-api.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js tools/patch-fast-safe-api.js
          git commit -m "fix: fail fast on API errors and delete attachments immediately"
          git push
