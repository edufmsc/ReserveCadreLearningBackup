<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8f3b12"><meta name="color-scheme" content="light"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="strict-origin-when-cross-origin"><title>教育中心備援學習平台｜V1.1.1</title><link rel="preconnect" href="https://script.google.com" crossorigin><link rel="preconnect" href="https://www.youtube.com" crossorigin><link rel="dns-prefetch" href="//script.google.com"><link rel="stylesheet" href="styles.css?v=1.1.1"><style>.app-shell{width:min(100%,1600px)!important;padding-left:18px!important;padding-right:18px!important}.boot-card{max-width:520px;margin:8vh auto 0;display:flex;align-items:center;justify-content:center;gap:12px;text-align:center}.boot-spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:v111spin .8s linear infinite}@keyframes v111spin{to{transform:rotate(360deg)}}.lesson-footer-actions{display:grid;grid-template-columns:minmax(150px,.45fr) minmax(260px,1fr) minmax(260px,1fr);gap:10px;align-items:stretch}.lesson-footer-actions .primary-button,.lesson-footer-actions .secondary-button{width:100%;min-height:50px}.lesson-footer-actions [hidden]{display:none!important}.pdf-embed-shell{width:100%;height:auto!important;min-height:68vh;border:1px solid var(--line);border-radius:14px;overflow:auto;background:#e8e4df;padding:12px}.pdf-canvas-stack{display:grid;gap:14px;justify-items:center;width:100%}.pdf-page-wrap{display:grid;gap:6px;justify-items:center;width:100%}.pdf-page-label{font-size:.76rem;font-weight:800;color:var(--muted);background:rgba(255,255,255,.9);padding:4px 9px;border-radius:999px}.pdf-page-canvas{display:block;max-width:100%;height:auto;background:#fff;box-shadow:0 3px 18px rgba(0,0,0,.18);user-select:none;-webkit-user-select:none}.pdf-loading{min-height:64vh;display:grid;place-items:center;text-align:center;color:var(--muted);font-weight:800}@media(max-width:760px){.app-shell{padding-left:10px!important;padding-right:10px!important}.lesson-footer-actions{grid-template-columns:1fr}.lesson-page__footer{bottom:4px}.content-block{padding:12px}.pdf-embed-shell{min-height:58vh;padding:7px}}</style></head><body><div class="app-shell"><header class="app-header"><div><p class="eyebrow">鬍鬚張｜教育中心</p><h1>教育中心備援學習平台</h1></div><span id="modeBadge" class="status-badge status-badge--checking">檢查連線</span></header><main class="app-main"><section id="bootView" class="card boot-card"><div class="boot-spinner" aria-hidden="true"></div><strong>正在載入最新資料…</strong></section><section id="loginView" class="card login-card" aria-labelledby="loginTitle" hidden><div class="card-heading"><p class="step-label">登入</p><h2 id="loginTitle">帳號＋密碼登入</h2></div><form id="loginForm" novalidate><label class="field-group"><span>帳號</span><input id="employeeId" name="employeeId" type="text" autocomplete="username" placeholder="請輸入帳號" required></label><label class="field-group"><span>密碼</span><div class="password-wrap"><input id="password" name="password" type="password" inputmode="numeric" autocomplete="current-password" maxlength="4" placeholder="4 碼數字" required><button id="togglePassword" class="icon-button" type="button">顯示</button></div></label><div id="loginMessage" class="form-message form-message--error" role="alert" hidden></div><button id="loginButton" class="primary-button" type="submit">登入</button></form></section><section id="dashboardView" class="dashboard" hidden><article class="card profile-card profile-card--compact"><div class="profile-topline"><div><p class="step-label">登入中</p><h2><span id="userName">—</span>，您好</h2><p class="profile-subline"><span id="userMeta">—</span></p></div><div class="profile-actions"><span id="userRole" class="role-badge">—</span><button id="logoutButton" class="text-button text-button--danger" type="button">登出</button></div></div></article><secti
