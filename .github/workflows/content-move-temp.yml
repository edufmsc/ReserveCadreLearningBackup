name: Temporary content move verifier
on:
  push:
    branches: [feat/v1-content-move-batch]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final content move UI fix
        run: |
          python3 tools/patch-content-move-fix.py
          node --check app.js
          node tools/verify-contract.js
          grep -q "contentMoveV1" app.js
          grep -q "moveContentsToLesson" app.js
          grep -q "data-content-move-check" app.js
          grep -q "批次移至子課程" app.js
          grep -q "aria-label=\"勾選教材" app.js
          ! grep -q "class=\"sr-only\"" app.js
          grep -q "const VERSION = 'V1.0'" app.js
      - name: Commit verified frontend
        run: |
          rm tools/patch-content-move-fix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js tools/patch-content-move-fix.py
          git commit -m "fix: finalize content move checkbox UI"
          git push origin HEAD:feat/v1-content-move-batch
