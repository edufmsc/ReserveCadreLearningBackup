name: Verify learning platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply staged FINAL3 patch
        run: |
          node tools/patch-v116-direct-submission-final.js
          python3 - <<'PY'
          import json
          p='apps-script/contract.json'
          data=json.load(open(p,encoding='utf-8'))
          data['build']='V116-FINAL3-20260827'
          data.setdefault('features',{})['packageDirectSubmissionV116']=True
          open(p,'w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          p='tools/verify-contract.js'
          s=open(p,encoding='utf-8').read().replace('V116-FINAL2-20260827','V116-FINAL3-20260827')
          open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Syntax check
        run: |
          node --check app.js
          node --check tools/verify-contract.js
      - name: Structural checks
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f api_config.js
          test -f apps-script/contract.json
          test -f tools/verify-contract.js
          grep -q "const VERSION = 'V1.1.6'" app.js
          grep -q "packageDirectSubmissionV116" app.js
          grep -q "loadXlsx" app.js
          grep -q "課程回傳設定" app.js
          grep -q "V1.1.6" index.html
          test ! -e app.v112.loader.js
          test ! -e app.bundle.001
      - name: Frontend backend contract
        run: node tools/verify-contract.js
      - name: Commit verified FINAL3 files
        run: |
          rm -f tools/patch-v116-direct-submission-final.js .github/workflows/apply-v116-direct-submission-temp.yml
          git show HEAD^:.github/workflows/verify.yml > .github/workflows/verify.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: finalize direct course submission and xlsx export"
          git push origin HEAD:main
