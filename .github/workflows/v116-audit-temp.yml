name: Temporary V116 audit patch
on:
  push:
    branches: [fix/v116-engineering-audit]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/patch-v116-audit.js
      - name: Verify frontend
        run: |
          node --check app.js
          grep -q "const VERSION = 'V1.1.6'" app.js
          grep -q "contentFileUploadV116" app.js
          grep -q "pdfPageObservers" app.js
          grep -q "state.apiConnected" app.js
          grep -q "V1.1.6" index.html
      - name: Commit generated frontend
        run: |
          rm tools/patch-v116-audit.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html tools/patch-v116-audit.js
          git commit -m "fix: V1.1.6 engineering audit frontend"
          git push
