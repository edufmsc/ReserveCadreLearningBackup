name: Temporary quick course builder verifier
on:
  push:
    branches: [feat/v1-quick-course-builder]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply quick course builder
        run: |
          python3 tools/patch-quick-course-builder.py
          node --check app.js
          node tools/verify-contract.js
          grep -q "data-copy-package" app.js
          grep -q "data-copy-lesson" app.js
          grep -q "openMaterialLibrary" app.js
          grep -q "reuseContents" app.js
          grep -q "copyLesson" app.js
          grep -q "copyPackage" app.js
          grep -q "courseReuseV1" app.js
          grep -q "const VERSION = 'V1.0'" app.js
      - name: Commit verified implementation
        run: |
          rm tools/patch-quick-course-builder.py
          rm .github/workflows/quick-course-builder-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js apps-script/contract.json tools/verify-contract.js tools/patch-quick-course-builder.py .github/workflows/quick-course-builder-temp.yml
          git commit -m "feat: add V1.0 quick course builder"
          git push origin HEAD:feat/v1-quick-course-builder
