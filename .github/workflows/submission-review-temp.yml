name: V1.0 submission review UX

on:
  push:
    branches:
      - fix/v1-submission-review-ux

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1-submission-review-ux
      - name: Apply submission review patch
        run: python tools/patch-v1-submission-review.py
      - name: Verify frontend
        run: |
          node --check app.js
          node tools/verify-contract.js
          grep -F 'adminSubmissionArea' app.js
          grep -F '更正為退件' app.js
          grep -F 'app.js?v=1.0-submission-review-20260914' index.html
      - name: Commit verified patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js index.html
          git commit -m 'fix: preserve submission filters and add area review controls'
          git push origin HEAD:fix/v1-submission-review-ux
