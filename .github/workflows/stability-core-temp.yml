name: V1.0 Stability Core

on:
  push:
    branches:
      - perf/v1-stability-core

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/v1-stability-core
      - name: Apply Stability Core
        run: python tools/patch-v1-stability-core.py
      - name: Verify frontend
        run: |
          node --check app.js
          node tools/verify-contract.js
          grep -F 'IDLE_LOGOUT_MS = 15 * 60 * 1000' app.js
          grep -F 'SYNC_INTERVAL_MS = 120000' app.js
          grep -F 'app.js?v=1.0-stability-core-20260922' index.html
      - name: Commit verified patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js index.html
          git commit -m 'perf: add V1.0 idle logout and reduce background traffic'
          git push origin HEAD:perf/v1-stability-core
